name: Go data checks (manual)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      # Selected PG suites run through the local/self-hosted workspace driver.
      # This standalone checkout has no sibling test harness or fixture modules.
      - name: Resolve exact SDK build context from go.mod
        if: github.event_name != 'pull_request'
        id: sdk
        run: |
          go mod download github.com/shitamachi/steam-proto-go
          sdk=$(go list -m -f '{{.Dir}}' github.com/shitamachi/steam-proto-go)
          test -d "$sdk"
          echo "directory=$sdk" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: zot.k.mygo.rocks
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            zot.k.mygo.rocks/forgelet/apps/steam-platform-data:sha-${{ github.sha }}
            zot.k.mygo.rocks/forgelet/apps/steam-platform-data:latest
          cache-from: type=gha,scope=steam-platform-etl
          cache-to: type=gha,scope=steam-platform-etl,mode=max
          build-contexts: steam_proto_go=${{ steps.sdk.outputs.directory }}
