name: Server checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STEAM_TEST_MODE: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -short -race ./...
      - run: make build

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: zot.k.mygo.rocks
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            zot.k.mygo.rocks/forgelet/apps/steam-platform-server:sha-${{ github.sha }}
            zot.k.mygo.rocks/forgelet/apps/steam-platform-server:latest
          cache-from: type=gha,scope=steam-platform-server
          cache-to: type=gha,scope=steam-platform-server,mode=max
