name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  build-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: zot.k.mygo.rocks
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: zot.k.mygo.rocks/forgelet/apps/steam-admin-web
          # 双镜像：版本 + latest。
          # - push 到 main：latest + short-sha
          # - push tag vX.Y.Z：vX.Y.Z + X.Y + latest
          flavor: |
            # latest 恒定指向最新构建；semver tag 时同指该版本
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
