---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workflowruns.ci.forgelet.dev
spec:
  group: ci.forgelet.dev
  names:
    kind: WorkflowRun
    listKind: WorkflowRunList
    plural: workflowruns
    singular: workflowrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runId
      name: Run
      type: string
    - jsonPath: .spec.event
      name: Event
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkflowRun is the in-cluster reference to a workflow run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkflowRunSpec is the in-cluster reference to a durable workflow run.
              It deliberately carries no history: only the fields needed to correlate
              JobRuns and reports with the control plane.
            properties:
              deliveryKey:
                description: DeliveryKey is "provider:deliveryID" of the triggering
