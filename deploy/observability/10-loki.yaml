# Loki single-binary for forgelet job and control-plane logs (spec 0010 T5).
# Filesystem storage; sized for dev/small installs — swap the backend for a
# scalable one before scaling out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: forgelet-system
  labels: {app: loki, app.kubernetes.io/part-of: forgelet}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - containerPort: 3100
              name: http
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /var/lib/loki
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: forgelet-system
  labels: {app: loki}
spec:
  selector: {app: loki}
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
# Schema v13 + TSDB per current Loki defaults. Retention is bounded by the
# compactor delete request below (72h dev default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: forgelet-system
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/lib/loki
      storage:
        filesystem:
          chunks_directory: /var/lib/loki/chunks
          rules_directory: /var/lib/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 72h
    compactor:
      working_directory: /var/lib/loki/compactor
      delete_request_store: filesystem
