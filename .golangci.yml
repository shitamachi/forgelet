version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gochecknoinits
    - misspell
    - nilerr
    - noctx
    - nolintlint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shitamachi/forgelet

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
